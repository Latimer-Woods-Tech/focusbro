name = "focusbro"
compatibility_date = "2026-07-26"
main = "api/src/index.js"
# FBQ-16: a preview URL / workers.dev route of the production worker runs with
# the PRODUCTION D1 + KV, so both stay off. Production is served only by the
# focusbro.net routes in [env.production]. Guarded by
# api/src/__tests__/wrangler-isolation.test.js.
workers_dev = false
preview_urls = false
account_id = "a1c8a33cbe8a3c9e260480433a0dbb06"

# Cron: accountability check-in delivery (Contender #10, Phase A · R-205).
# Every minute — a check-in scheduled for 2:00 should fire at ~2:00, not 2:05.
triggers = { crons = ["* * * * *"] }

# Note: Removed 'site' config - Worker handles all routes including static HTML serving
# This prevents conflicts between Worker routes and static file serving

# Default (non-production) scope: used by `wrangler dev` and any bare
# `wrangler deploy` / `versions upload` WITHOUT --env. It must never carry a
# production id (FBQ-16). `wrangler dev --local` simulates D1/KV on disk and
# ignores these ids; a remote run against them fails closed instead of
# touching prod. Production bindings live ONLY in [env.production].
# A real staging D1/KV would replace these placeholders (see PR #FBQ-16).
[[d1_databases]]
binding = "DB"
database_name = "focusbro-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Cloudflare KV Store (for user data caching)
[[kv_namespaces]]
binding = "KV_CACHE"
id = "00000000000000000000000000000000"

# R2: the ambient recordings (scripts/audio/build.py -> audio/manifest.json),
# served by GET /audio/<name>.<sha10>.m4a in api/src/audio.js.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "focusbro-audio"

# Environment-specific config
[env.production]
routes = [
  { pattern = "focusbro.net/*", zone_name = "focusbro.net" },
  { pattern = "*.focusbro.net/*", zone_name = "focusbro.net" }
]
d1_databases = [{ binding = "DB", database_id = "f6b1685b-a879-4d42-9c23-a30da614be01", database_name = "focusbro-db", migrations_dir = "migrations" }]
kv_namespaces = [{ binding = "KV_CACHE", id = "732d985fd2b84650aa828f7982ba0f87" }]
r2_buckets = [{ binding = "AUDIO", bucket_name = "focusbro-audio" }]
# PRO_PRICE_ID: the FocusBro Pro one-time $9.99 price (Stripe prod_VMZ14lnJeKeFIM).
# A price id is not a secret. STRIPE_SECRET_KEY is a worker SECRET, never here.
vars = { ENV = "production", API_ORIGIN = "https://focusbro.net", FOUNDER_EMAIL = "adrper79@gmail.com", AUTH_EMAIL_FROM = "support@latwoodtech.com", PRO_PRICE_ID = "price_1ULptiAW1229TZtee4VTiTma", HOME_PROMISE_FIRST = "1", ANALYTICS_RETENTION_DAYS = "395" }
triggers = { crons = ["* * * * *"] }

# Staging (Site Quality Battery R-06, PLATFORM_STANDARDS §15.1): its own worker,
# its own D1 + KV, never indexed. Deployed by the deploy-staging job in
# .github/workflows/deploy.yml (push to `staging`, or workflow_dispatch).
# Guarded by api/src/__tests__/staging-env.test.js.
#  - ZONE ROUTE, not a Custom Domain: production owns `*.focusbro.net/*`, and a
#    route runs before a Custom Domain's worker, so a staging Custom Domain
#    would be served by focusbro-production with production data. The more
#    specific `staging.focusbro.net/*` wins over the wildcard. It needs a
#    proxied DNS record for staging.focusbro.net (one-time live step).
#  - ENV = "staging" switches on X-Robots-Tag: noindex and a Disallow-all
#    robots.txt (api/src/index.js isStagingEnv).
#  - Bindings are not inherited by an env, so every production binding is
#    declared again. AUDIO is the one shared resource: read-only public
#    recordings (api/src/audio.js only reads it), not user data.
#  - No PRO_PRICE_ID (the live $9.99 price) and no secrets copied from
#    production: staging holds synthetic data only.
[env.staging]
name = "focusbro-staging"
routes = [
  { pattern = "staging.focusbro.net/*", zone_name = "focusbro.net" }
]
d1_databases = [{ binding = "DB", database_id = "e577d581-c498-4fce-9b45-87ba99c81f62", database_name = "focusbro-staging-db", migrations_dir = "migrations" }]
kv_namespaces = [{ binding = "KV_CACHE", id = "328659471937490a85870a3cc39d935d" }]
r2_buckets = [{ binding = "AUDIO", bucket_name = "focusbro-audio" }]
vars = { ENV = "staging", API_ORIGIN = "https://staging.focusbro.net", AUTH_EMAIL_FROM = "support@latwoodtech.com", HOME_PROMISE_FIRST = "1", ANALYTICS_RETENTION_DAYS = "395" }
triggers = { crons = ["* * * * *"] }

[env.development]
vars = { ENV = "development", API_ORIGIN = "http://localhost:8787" }
