<!doctype html>
<!-- Offline fallback. The app runs in remote-URL mode (capacitor.config.json
     server.url → https://focusbro.net); Capacitor shows this page (server.errorPath)
     only when the live site cannot be loaded. Keep it tiny, branded, and inline —
     it ships inside the binary and must work with no network at all.
     Check-in reminders already scheduled on the device still fire while offline. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FocusBro</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0a0e27; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; text-align: center;
    }
    .wrap { padding: 2rem; max-width: 22rem; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 1.25rem;
      border-radius: 20px; display: grid; place-items: center; font-size: 36px;
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25);
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    p { opacity: 0.8; margin: 0 0 1.5rem; line-height: 1.45; }
    button {
      background: linear-gradient(135deg, #0ea5e9, #14b8a6); color: #0a0e27;
      border: 0; border-radius: 10px; padding: 0.8rem 2rem;
      font-size: 1rem; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">🧠</div>
    <h1>No connection right now</h1>
    <p>FocusBro needs the internet to load. Your check-in reminders are still set on this phone and will reach you on time.</p>
    <button type="button" onclick="window.location.href='https://focusbro.net/'">Try again</button>
  </div>
</body>
</html>
