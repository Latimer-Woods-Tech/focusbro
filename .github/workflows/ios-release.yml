name: iOS Release — unsigned compile, then gated signing

# FocusBro iOS shell (mobile/ios — Capacitor, Swift Package Manager, remote-URL).
#
# Job 1 `unsigned` (every run, every ref, including PRs that touch mobile/ios): npm ci + cap sync + xcodebuild for the
# iOS Simulator with CODE_SIGNING_ALLOWED=NO. It has NO id-token permission, NO GCP
# auth and fetches NO secret, so a cloud compile never touches credentials.
#
# Job `guard-tests` (ubuntu, no secrets, no id-token): .github/scripts/ios-release-guard.test.sh proves the guard rejects bad
# inputs with FAKE stubs, and that deleting each check makes its case fail. Cloud-only; never run on a dev host.
#
# Job 2 `signed`: needs `unsigned`, and runs ONLY for a manual dispatch with mode=signed on
# refs/heads/main at the exact commit named in expected_sha. There is NO tag trigger and NO push trigger: a signed
# run is always a deliberate dispatch, one per security GO (jc-security #30297). It reads the App Store Connect API key from GCP Secret Manager
# (factory-495015) via WIF — never GitHub secrets (Standing Law 3):
#   ASC_KEY_ID        App Store Connect API key ID (10 chars)
#   ASC_ISSUER_ID     issuer UUID (Users and Access → Integrations → App Store Connect API)
#   ASC_PRIVATE_KEY   contents of the AuthKey_<KEYID>.p8 file
# It archives with automatic signing, and FAILS CLOSED if any ASC secret is missing. The TestFlight upload happens only
# for a dispatch with skip_upload=false (default true: build, never upload).
# Founder steps: docs/MOBILE_APP.md → "iOS".

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (digits and dots, e.g. 0.1.0) — blank = mobile/package.json'
        required: false
      mode:
        description: 'unsigned = compile only, the credentialed job is SKIPPED; signed = archive with the App Store Connect key (main only, one run per GO)'
        required: false
        type: choice
        options: [unsigned, signed]
        default: unsigned
      expected_sha:
        description: 'mode=signed only: the exact 40-hex commit this run must be on (the GO names it); blank otherwise'
        required: false
      skip_upload:
        description: 'true = archive only, never upload to TestFlight (set false to upload)'
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/capacitor.config.json'
      - '.github/workflows/ios-release.yml'
      - '.github/scripts/ios-release-guard*'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard-tests:
    name: Guard script + workflow structure tests (fake stubs, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run guard harness (fake gcloud/xcodebuild, proof of rejection)
        run: bash .github/scripts/ios-release-guard.test.sh

  unsigned:
    name: Unsigned simulator compile (no secrets)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies + sync iOS
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: Simulator build (no signing) — proves the project compiles
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  signed:
    name: Archive (automatic signing) and optional TestFlight upload
    needs: unsigned
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # WIF → GCP Secret Manager
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # FIRST step, before any credential: every input is passed as env data, never interpolated into shell text.
      - name: Guard (event, mode, ref, sha, version)
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION_INPUT: ${{ inputs.version_name }}
          SKIP_UPLOAD_INPUT: ${{ inputs.skip_upload }}
        run: |
          if [ -z "$VERSION_INPUT" ]; then PKG_VERSION="$(node -p "require('./mobile/package.json').version")"; export PKG_VERSION; fi
          bash .github/scripts/ios-release-guard.sh

      - name: Build number
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "BUILD_NUMBER=$(( 10000 + RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      # npm lifecycle scripts run here, BEFORE any credential exists on the runner disk (jc-security #30314).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies + sync iOS
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/891842778224/locations/global/workloadIdentityPools/github-factory/providers/github
          service_account: factory-sa@factory-495015.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Resolve App Store Connect key (gate)
        id: asc
        run: |
          have=true
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if gcloud secrets versions access latest --secret="$s" --project=factory-495015 > "$RUNNER_TEMP/$s" 2>/dev/null && [ -s "$RUNNER_TEMP/$s" ]; then
              echo "$s: present ($(wc -c < "$RUNNER_TEMP/$s") bytes)"
            else
              echo "$s: absent"; have=false
            fi
          done
          if [ "$have" = true ]; then
            echo "::add-mask::$(cat "$RUNNER_TEMP/ASC_KEY_ID")"
            echo "::add-mask::$(cat "$RUNNER_TEMP/ASC_ISSUER_ID")"
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            KEY_ID="$(cat "$RUNNER_TEMP/ASC_KEY_ID")"
            cp "$RUNNER_TEMP/ASC_PRIVATE_KEY" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
            echo "key_path=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_OUTPUT"
          else
            echo "::error::App Store Connect API key not complete in Secret Manager — a signed run fails closed. See docs/MOBILE_APP.md (iOS)."
            rm -f "$RUNNER_TEMP/ASC_PRIVATE_KEY" "$RUNNER_TEMP/ASC_KEY_ID" "$RUNNER_TEMP/ASC_ISSUER_ID"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/ASC_PRIVATE_KEY"
          echo "signing=$have" >> "$GITHUB_OUTPUT"

      - name: Archive (automatic signing via the ASC API key)
        if: ${{ steps.asc.outputs.signing == 'true' }}
        working-directory: mobile/ios/App
        env:
          KEY_PATH: ${{ steps.asc.outputs.key_path }}
          MARKETING_VERSION_VALUE: ${{ steps.version.outputs.VERSION_NAME }}
          BUILD_NUMBER_VALUE: ${{ steps.build.outputs.BUILD_NUMBER }}
        run: |
          KEY_ID="$(cat "$RUNNER_TEMP/ASC_KEY_ID")"; ISSUER="$(cat "$RUNNER_TEMP/ASC_ISSUER_ID")"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FocusBro.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            MARKETING_VERSION="$MARKETING_VERSION_VALUE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER_VALUE" \
            archive | tail -30

      - name: Export IPA + upload to TestFlight
        if: ${{ steps.asc.outputs.signing == 'true' && steps.version.outputs.UPLOAD == 'true' }}
        env:
          KEY_PATH: ${{ steps.asc.outputs.key_path }}
        run: |
          KEY_ID="$(cat "$RUNNER_TEMP/ASC_KEY_ID")"; ISSUER="$(cat "$RUNNER_TEMP/ASC_ISSUER_ID")"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" -c "Add :signingStyle string automatic" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FocusBro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded to App Store Connect (destination=upload); it appears in TestFlight after processing."

      - name: Remove key material
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP"/ASC_*
