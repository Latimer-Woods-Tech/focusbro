name: Docs Health

# Self-contained and blocking. The former vendored health runner invoked scripts
# that were never vendored, then every failure was ignored. This workflow runs
# only checks this repository actually owns and fails when they find a defect.

on:
  pull_request:
    paths: ['**/*.md', 'docs/**', 'README*']
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Active documentation links resolve
        run: node scripts/docs/check-links.mjs
