name: FocusBro API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: "24.x"
        cache: "npm"
        cache-dependency-path: |
          package-lock.json
          api/package-lock.json
    
    - name: Install root dependencies
      run: npm ci
    
    - name: Install API dependencies
      run: cd api && npm ci

    - name: Content ledger up to date (un-ledgered guides are a hard fail)
      run: node scripts/generate-content-ledger.mjs --check

    - name: Lint API (fails on errors; warnings are a ratcheting baseline)
      run: cd api && npm run lint

    - name: Build HTML module
      run: node create-html-module.js

    - name: Apply D1 migrations to an empty local database
      run: |
        set -euo pipefail
        state_dir="$(mktemp -d)"
        npx wrangler d1 migrations apply focusbro-db --local --persist-to "$state_dir" --env production
        npx wrangler d1 migrations list focusbro-db --local --persist-to "$state_dir" --env production
        npx wrangler d1 execute focusbro-db --local --persist-to "$state_dir" --env production \
          --command 'SELECT email_verified_at FROM users LIMIT 0; SELECT token_hash FROM auth_action_tokens LIMIT 0; SELECT data_size FROM sync_logs LIMIT 0; SELECT device_id, is_active FROM devices LIMIT 0; SELECT revision_id, idempotency_key FROM user_data_snapshots LIMIT 0;'
    
    - name: Run API tests (with coverage floor)
      run: cd api && npm run test:coverage
      
    - name: Show logs on failure
      if: failure()
      run: ls -la && pwd && echo "=== Node version ===" && node --version && npm --version

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: "24.x"
        cache: "npm"
        cache-dependency-path: |
          package-lock.json
          api/package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Install API dependencies
      run: cd api && npm ci

    - name: Build HTML module
      run: node create-html-module.js

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright (chromium)
      timeout-minutes: 10
      run: |
        cd api
        for attempt in 1 2 3; do
          echo "::group::Playwright install attempt $attempt"
          if timeout 240 npx playwright install --with-deps chromium; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          echo "Playwright install attempt $attempt stalled or failed; retrying in 10s..."
          sleep 10
        done
        echo "Playwright install failed after 3 attempts"
        exit 1

    - name: Client smoke (Playwright)
      run: cd api && npm run test:smoke

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: api/playwright-report/
        retention-days: 7
