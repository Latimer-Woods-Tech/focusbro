name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json
    
    - name: Install API dependencies
      run: cd api && npm ci

    - name: Apply reviewed D1 migrations before deploying the Worker
      run: npx wrangler d1 migrations apply focusbro-db --remote --env production
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    
    - name: Build HTML module
      run: node create-html-module.js
    
    - name: Deploy Frontend Worker to Cloudflare Workers (Production)
      id: deploy-frontend
      run: |
        # Deploy frontend worker from root directory.
        # pipefail + PIPESTATUS are REQUIRED: without them, `wrangler | tee`
        # reports tee's exit code (always 0), so a failed deploy passes as
        # green without deploying. See issue #6 (root cause of Phase 1 lie).
        set -o pipefail
        echo "🚀 Deploying frontend worker..."
        npx wrangler deploy --env production --var "BUILD_SHA:${GITHUB_SHA}" --keep-vars 2>&1 | tee frontend-deploy.log
        FRONTEND_EXIT=${PIPESTATUS[0]}
        echo "📋 Frontend deployment log (wrangler exit ${FRONTEND_EXIT}):"
        cat frontend-deploy.log
        exit $FRONTEND_EXIT
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    
    # NOTE (#44): the second "Deploy API" step was removed here. It deployed the
    # SAME api/src/index.js a second time as a routeless duplicate worker
    # (focusbro-api-production, api/wrangler.toml — deleted). One worker serves
    # everything: focusbro-production, routes focusbro.net/*.

    - name: Verify the deployed first-party guide scripts run in a browser
      # The calculator shipped dead once: the Worker bundle wrapped function
      # declarations in esbuild's `__name` helper, the served script referenced
      # it, and the browser threw. Every local test passed because the smoke
      # serves source, not the bundle. So after deploying, fetch the LIVE bytes
      # and refuse to call the deploy green if they carry a bundler helper or
      # fail to parse.
      #
      # `wrangler deploy` returns before every PoP serves the new version: the
      # first run of this step fetched the PREVIOUS script one second after
      # deploy and failed on a build that was in fact fixed. So: first wait
      # until /health reports THIS commit, then check the scripts, retrying
      # through propagation. Worker responses are not edge-cached here (no
      # cf-cache-status), so a stale read is propagation, not cache.
      run: |
        set -euo pipefail
        deadline=$((SECONDS + 180))
        until [ "$(curl -s -H 'Cache-Control: no-cache' https://focusbro.net/health | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build_sha",""))' 2>/dev/null)" = "$GITHUB_SHA" ]; do
          [ $SECONDS -lt $deadline ] || { echo "::error::/health never reported $GITHUB_SHA within 180s"; exit 1; }
          echo "waiting for the edge to serve $GITHUB_SHA…"; sleep 5
        done
        echo "edge serves $GITHUB_SHA"
        for s in /guides/view.js /guides/caffeine.js /guides/breath.js; do
          ok=0
          for attempt in $(seq 1 12); do
            url="https://focusbro.net${s}?v=${GITHUB_SHA}"
            code=$(curl -s -H 'Cache-Control: no-cache' -o "/tmp/$(basename "$s")" -w '%{http_code}' -A 'deploy-verify' "$url")
            if [ "$code" = "200" ] && ! grep -qE '__name\(|__publicField|__esm\(' "/tmp/$(basename "$s")" && node --check "/tmp/$(basename "$s")" 2>/dev/null; then
              ok=1; echo "ok $s ($(wc -c < "/tmp/$(basename "$s")") bytes, attempt $attempt)"; break
            fi
            echo "attempt $attempt: $s http=$code — not yet clean, retrying"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::$s still carries a bundler helper, fails to parse, or is not 200 after propagation"; exit 1; }
        done

    - name: Verify the CSP is enforced on a guide page and reported on the app shell
      # G299: the policy is enforced on the guides layer (no inline script
      # there) and report-only on the app shell. If a deploy ever flips that,
      # ads or the app break with nothing visible to /health — so read the
      # live headers.
      run: |
        set -euo pipefail
        g=$(curl -sI -H 'Cache-Control: no-cache' https://focusbro.net/guides/box-breathing.html)
        echo "$g" | grep -qi '^content-security-policy: ' || { echo "::error::guide page is not enforcing CSP"; exit 1; }
        if echo "$g" | grep -qi '^content-security-policy-report-only:'; then echo "::error::guide page still carries a report-only policy"; exit 1; fi
        echo "$g" | grep -i '^content-security-policy: ' | grep -q "script-src 'self' https://pagead2.googlesyndication.com" || { echo "::error::enforced policy lost the ad loader host"; exit 1; }
        h=$(curl -sI -H 'Cache-Control: no-cache' https://focusbro.net/)
        echo "$h" | grep -qi '^content-security-policy-report-only:' || { echo "::error::app shell lost its report-only policy"; exit 1; }
        if echo "$h" | grep -qi '^content-security-policy: '; then echo "::error::app shell is enforcing CSP — the legacy inline scripts would be blocked"; exit 1; fi
        echo "CSP: enforced on the guide page, report-only on the app shell"

    - name: Purge Cloudflare Cache
      run: |
        # Determine which API token to use
        API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CLOUDFLARE_API:-${CF_API_TOKEN}}}"
        
        if [ -z "$API_TOKEN" ]; then
          echo "❌ No Cloudflare API token found"
          exit 1
        fi
        
        ZONE_ID="62cd855349c37acba7c11db6fe2025cc"
        echo "🧹 Purging Cloudflare cache for zone: $ZONE_ID"
        
        RESPONSE=$(curl -s -X POST \
          "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"purge_everything":true}')
        
        echo "✅ Cache purge response:"
        echo "$RESPONSE" | jq .
        
        # Check if purge was successful
        SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
        if [ "$SUCCESS" == "true" ]; then
          echo "✅ Cache purge completed successfully!"
        else
          ERROR=$(echo "$RESPONSE" | jq -r '.errors[0].message // "Unknown error"')
          echo "⚠️ Cache purge failed: $ERROR"
          exit 1
        fi
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    
    - name: Check deployment secret
      if: failure()
      run: |
        echo "❌ Deployment failed - CLOUDFLARE_API_TOKEN secret is not set"
        echo ""
        echo "📋 To fix this:"
        echo "1. Go to: https://github.com/adrper79-dot/focusbro/settings/secrets/actions"
        echo "2. Verify that a secret named 'CLOUDFLARE_API_TOKEN' exists"
        echo "3. If it doesn't exist, create it:"
        echo "   - Name: CLOUDFLARE_API_TOKEN"
        echo "   - Value: <your Cloudflare API token>"
        echo ""
        echo "4. Get your Cloudflare API token from:"
        echo "   - https://dash.cloudflare.com/profile/api-tokens"
        echo "   - Click 'Create Token' → 'Edit Cloudflare Workers'"
        echo ""
        echo "Current secret names available: (if any would be listed here...)"
        exit 1
    
    - name: Log deployment status
      run: |
        echo "✅ Deployment complete!"
        echo "API deployed to: https://focusbro.net"
        echo "Check https://dash.cloudflare.com for detailed logs"
    
    - name: Verify deployment
      run: |
        set -euo pipefail
        base="https://focusbro.net"
        expected="${GITHUB_SHA}"

        for attempt in $(seq 1 12); do
          health="$(curl --fail --silent --show-error --max-time 10 \
            "${base}/health?release=${expected}" || true)"
          homepage="$(curl --fail --silent --show-error --max-time 10 \
            "${base}/?release=${expected}" || true)"
          metrics_status="$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            "${base}/api/internal/metrics?release=${expected}" || true)"
          deployed="$(printf '%s' "${health}" | jq -r '.build_sha // empty' 2>/dev/null || true)"

          if [ "${deployed}" = "${expected}" ] \
            && grep -Fq "The check-in that follows up." <<< "${homepage}" \
            && [ "${metrics_status}" = "401" ]; then
            echo "✅ Verified exact release ${expected}: health, accountability homepage, and auth boundary"
            exit 0
          fi

          echo "Attempt ${attempt}/12: build=${deployed:-missing}, metrics=${metrics_status:-missing}; retrying..."
          sleep 5
        done

        echo "❌ Production did not converge to release ${expected}"
        exit 1
